<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phòng Chat Chung</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115; color: #e6e6e6; height: 100vh; display: flex; flex-direction: column;
  }
  #login-screen {
    flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  #login-screen h1 { font-size: 1.4rem; margin-bottom: 1rem; }
  #login-screen input {
    padding: 12px 14px; border-radius: 8px; border: 1px solid #333; background: #1a1d24;
    color: #fff; font-size: 1rem; width: 260px; outline: none;
  }
  #login-screen button {
    margin-top: 12px; padding: 10px 20px; border-radius: 8px; border: none;
    background: #4f7cff; color: #fff; font-size: 1rem; cursor: pointer;
  }
  #login-error { color: #ff6b6b; margin-top: 8px; font-size: 0.9rem; min-height: 1.2em; }

  #chat-screen { display: none; flex: 1; flex-direction: column; height: 100vh; }
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; background: #161920; border-bottom: 1px solid #262a33;
  }
  #topbar .title { font-weight: 600; }
  #topbar .users { font-size: 0.85rem; color: #9aa0ab; max-width: 55%; text-align: right; }

  #messages {
    flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; line-height: 1.35; word-wrap: break-word; }
  .msg .meta { font-size: 0.72rem; color: #9aa0ab; margin-bottom: 2px; }
  .msg.mine { align-self: flex-end; background: #4f7cff; color: #fff; }
  .msg.other { align-self: flex-start; background: #1e222b; }
  .msg.bot { align-self: flex-start; background: #2a1f3d; border: 1px solid #7c4dff55; }
  .msg.system { align-self: center; background: transparent; color: #8a8f99; font-size: 0.8rem; font-style: italic; padding: 2px; }

  #input-bar { display: flex; gap: 8px; padding: 10px 12px; background: #161920; border-top: 1px solid #262a33; }
  #msg-input {
    flex: 1; padding: 12px 14px; border-radius: 24px; border: 1px solid #333;
    background: #1a1d24; color: #fff; font-size: 1rem; outline: none;
  }
  #send-btn {
    padding: 0 20px; border-radius: 24px; border: none; background: #4f7cff; color: #fff; cursor: pointer; font-size: 1rem;
  }
  #bot-hint { font-size: 0.72rem; color: #6c7280; padding: 0 16px 6px; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>💬 Vào phòng chat chung</h1>
  <input id="username-input" type="text" placeholder="Nhập username của bạn..." maxlength="30" autofocus />
  <button id="join-btn">Tham gia</button>
  <div id="login-error"></div>
</div>

<div id="chat-screen">
  <div id="topbar">
    <div class="title">💬 Phòng chat chung</div>
    <div class="users" id="user-list"></div>
  </div>
  <div id="messages"></div>
  {% if bot_enabled %}
  <div id="bot-hint">
    {% if not human_like_mode %}
      Gõ "@{{ bot_name }}" trong tin nhắn để gọi trợ lý ảo {{ bot_name }} trả lời.
    {% endif %}
  </div>
  {% endif %}
  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="Nhập tin nhắn..." autocomplete="off" maxlength="{{ max_message_length }}" />
    <button id="send-btn">Gửi</button>
  </div>
</div>

<script>
const socket = io();
let myUsername = null;

const loginScreen = document.getElementById('login-screen');
const chatScreen = document.getElementById('chat-screen');
const usernameInput = document.getElementById('username-input');
const joinBtn = document.getElementById('join-btn');
const loginError = document.getElementById('login-error');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const userListEl = document.getElementById('user-list');

function doJoin() {
  const name = usernameInput.value.trim();
  if (!name) { loginError.textContent = 'Vui lòng nhập username.'; return; }
  socket.emit('join', { username: name });
}
joinBtn.addEventListener('click', doJoin);
usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });

socket.on('join_error', data => { loginError.textContent = data.error; });

socket.on('joined', data => {
  myUsername = data.username;
  loginScreen.style.display = 'none';
  chatScreen.style.display = 'flex';
  msgInput.focus();
});

socket.on('history', data => {
  messagesEl.innerHTML = '';
  data.messages.forEach(renderMessage);
  scrollToBottom();
});

socket.on('new_message', msg => {
  renderMessage(msg);
  scrollToBottom();
});

socket.on('user_list', data => {
  userListEl.textContent = 'Đang online: ' + data.users.join(', ');
});

function renderMessage(msg) {
  const div = document.createElement('div');
  if (msg.type === 'system') {
    div.className = 'msg system';
    div.textContent = msg.text;
  } else {
    const isBot = msg.type === 'bot';
    const isMine = msg.user === myUsername;
    div.className = 'msg ' + (isBot ? 'bot' : (isMine ? 'mine' : 'other'));
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (isBot ? '🤖 ' : '') + msg.user;
    const body = document.createElement('div');
    body.textContent = msg.text;
    div.appendChild(meta);
    div.appendChild(body);
  }
  messagesEl.appendChild(div);
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  socket.emit('chat_message', { text });
  msgInput.value = '';
}
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
